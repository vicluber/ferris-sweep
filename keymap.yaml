    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
combos:
- p: [0, 1]
  k: ESC
- p: [20, 21]
  k: ENTER
- p: [8, 9]
  k: bluetooth
- p: [20, 29]
  k: mouse
- p: [12, 13]
  k: BSPC
- p: [16, 17]
  k: BSPC
- p: [28, 29]
  k: ENTER
