    - F5
    - F3
    - F1
    - F9
    - F8
    - F10
    - F2
    - F4
    - F6
    - {type: held}
    - {t: ▽, type: trans}
    - SPC
    - {type: held}
  bluetooth:
  - - BT CLR ALL
    - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
