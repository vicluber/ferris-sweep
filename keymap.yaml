layout: {zmk_keyboard: cradio}
layers:
  default:
  - [Q, W, E, R, T, Y, U, I, O, P, A, S, D, F, G, H, J, K, L, '&ntilde', Z, X, C, V, B, N, M, ',', ., '?', nav, LSHFT, SPC, sym]
  nav:
  - - PSCRN
    - Gui+Sft+TAB
    - {t: Gui+LSHFT, h: sticky}
    - Gui+TAB
    - Gui+W
    - PG UP
    - BSPC
    - UP
    - DEL
    - '&caps_word'
    - {t: LGUI, h: sticky}
    - {t: LALT, h: sticky}
    - {t: LSHFT, h: sticky}
    - {t: LCTRL, h: sticky}
    - END
    - TAB
    - LEFT
    - DOWN
    - RIGHT
    - ESC
    - Gui+Z
    - Gui+X
    - Gui+C
    - Gui+V
    - Gui+Sft+Z
    - PG DN
    - PREV
    - PP
    - NEXT
    - APP
    - {type: held}
    - {t: ▽, type: trans}
    - ENTER
    - {t: ▽, type: trans}
  sym:
  - - ^
    - '['
    - '{'
    - (
    - <
    - '>'
    - )
    - '}'
    - ']'
    - ⌥+E
    - '-'
    - '*'
    - _
    - '='
    - '@'
    - '#'
    - {t: LCTRL, h: sticky}
    - {t: LSHFT, h: sticky}
    - {t: LALT, h: sticky}
    - {t: LGUI, h: sticky}
    - +
    - ':'
    - /
    - ;
    - '%'
    - $
    - '&'
    - \
    - '|'
    - ''''
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - SPC
    - {type: held}
  num:
  - - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    - '0'
    - {t: LGUI, h: sticky}
    - {t: LALT, h: sticky}
    - {t: LSHFT, h: sticky}
    - {t: LCTRL, h: sticky}
    - F11
    - F12
    - {t: LCTRL, h: sticky}
    - {t: LSHFT, h: sticky}
    - {t: LALT, h: sticky}
    - {t: LGUI, h: sticky}
