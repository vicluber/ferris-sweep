  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '&msc SCRL_UP'
    - '&mkp LCLK'
    - '&mmv MOVE_UP'
    - '&mkp RCLK'
