parse_config:
  zmk_keycode_map:
    RA(N): "⌥+N"
    RA(E): "⌥+E"

draw_config:
  dark_mode: true
  key_w: 72
  key_h: 66
  split_gap: 40
  arc_radius: 8
  glyph_tap_size: 16
  glyph_hold_size: 13
  separate_combo_diagrams: true
  combo_diagrams_scale: 2
  svg_extra_style: |
    svg.keymap {
      background-color: #1a1b2e;
      fill: #c8cdd8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      font-size: 13px;
    }
    rect.key {
      fill: #2a2d42;
      stroke: #464a6e;
      stroke-width: 1.5;
    }
    rect.key, rect.combo { stroke: #464a6e; }
    rect.combo, rect.combo-separate { fill: #1e3a6e; stroke: #5579b5; }
    rect.held { fill: #2a3580; stroke: #6679e4; stroke-width: 2; }
    text { fill: #c8cdd8 !important; }
    text.label { fill: #5a6070 !important; stroke: none; font-weight: 600; font-size: 12px; }
    text.trans { fill: #3a3f60 !important; }
    path.combo { stroke: #4a4f70; }
    g.layer-sym text.tap { font-size: 16px; }
